{% extends "base.html" %}
{% block title %}{{ t.create_quiz }}{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>{{ t.create_quiz }}</h3>
                </div>
                <div class="card-body">
                    <form method="POST" id="quizForm">
                        <div class="form-group">
                            <label for="quiz_title">{{ t.quiz_title }}</label>
                            <input type="text" class="form-control" id="quiz_title" name="quiz_title" required>
                        </div>

                        <div id="questionContainer">
                            <!-- First question -->
                            <div class="question-block mb-4">
                                <div class="form-group">
                                    <label>{{ t.question }} 1</label>
                                    <input type="text" class="form-control" name="quiz_questions[]" required>
                                </div>
                                <div class="form-group">
                                    <label>{{ t.question_type }}</label>
                                    <select class="form-control quiz-question-type" name="quiz_question_types[]" onchange="handleQuestionTypeChange(this)">
                                        <option value="short_answer">{{ t.short_answer }}</option>
                                        <option value="multiple_choice">{{ t.multiple_choice }}</option>
                                        <option value="true_false">{{ t.true_false }}</option>
                                    </select>
                                </div>
                                <div class="form-group quiz-options-group" style="display: none;">
                                    <label>{{ t.options }}</label>
                                    <div class="quiz-options-list"></div>
                                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addOption(this)">{{ t.add_option }}</button>
                                </div>
                                <div class="form-group quiz-answer-group">
                                    <label>{{ t.answer }}</label>
                                    <input type="text" class="form-control quiz-answer-input" name="quiz_answers[]" required>
                                </div>
                            </div>
                        </div>
                        
                        <button type="button" class="btn btn-secondary mb-3" onclick="addQuestion()">
                            {{ t.add_question }}
                        </button>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">{{ t.create_quiz }}</button>
                            <a href="{{ url_for('quizzes') }}" class="btn btn-secondary">{{ t.cancel }}</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function handleQuestionTypeChange(select) {
    const block = select.closest('.question-block');
    const optionsGroup = block.querySelector('.quiz-options-group');
    const answerGroup = block.querySelector('.quiz-answer-group');
    let answerInput = block.querySelector('.quiz-answer-input');
    
    if (select.value === 'multiple_choice') {
        optionsGroup.style.display = '';
        answerGroup.style.display = '';
        if (answerInput.tagName !== 'INPUT') {
            answerGroup.innerHTML = `<label>{{ t.answer }}</label><input type="text" class="form-control quiz-answer-input" name="quiz_answers[]" placeholder="{{ t.enter_correct_option_number }}" required>`;
        } else {
            answerInput.type = 'text';
            answerInput.placeholder = '{{ t.enter_correct_option_number }}';
        }
    } else if (select.value === 'true_false') {
        optionsGroup.style.display = 'none';
        answerGroup.style.display = '';
        answerGroup.innerHTML = `<label>{{ t.answer }}</label><select class="form-control quiz-answer-input" name="quiz_answers[]" required><option value="True">True</option><option value="False">False</option></select>`;
    } else {
        optionsGroup.style.display = 'none';
        answerGroup.style.display = '';
        if (answerInput.tagName !== 'INPUT') {
            answerGroup.innerHTML = `<label>{{ t.answer }}</label><input type="text" class="form-control quiz-answer-input" name="quiz_answers[]" required>`;
        } else {
            answerInput.type = 'text';
            answerInput.placeholder = '';
        }
    }
}

function addQuestion() {
    const container = document.getElementById('questionContainer');
    const questionCount = container.querySelectorAll('.question-block').length + 1;
    const questionBlock = document.createElement('div');
    questionBlock.className = 'question-block mb-4';
    questionBlock.innerHTML = `
        <div class="form-group">
            <label>{{ t.question }} ${questionCount}</label>
            <input type="text" class="form-control" name="quiz_questions[]" required>
        </div>
        <div class="form-group">
            <label>{{ t.question_type }}</label>
            <select class="form-control quiz-question-type" name="quiz_question_types[]" onchange="handleQuestionTypeChange(this)">
                <option value="short_answer">{{ t.short_answer }}</option>
                <option value="multiple_choice">{{ t.multiple_choice }}</option>
                <option value="true_false">{{ t.true_false }}</option>
            </select>
        </div>
        <div class="form-group quiz-options-group" style="display: none;">
            <label>{{ t.options }}</label>
            <div class="quiz-options-list"></div>
            <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addOption(this)">{{ t.add_option }}</button>
        </div>
        <div class="form-group quiz-answer-group">
            <label>{{ t.answer }}</label>
            <input type="text" class="form-control quiz-answer-input" name="quiz_answers[]" required>
        </div>
    `;
    container.appendChild(questionBlock);
}

function addOption(btn) {
    const optionsList = btn.parentElement.querySelector('.quiz-options-list');
    const optionCount = optionsList.children.length + 1;
    const optionDiv = document.createElement('div');
    optionDiv.className = 'input-group mb-2';
    optionDiv.innerHTML = `<div class="input-group-prepend"><span class="input-group-text">${optionCount}</span></div><input type="text" class="form-control" name="quiz_option_${optionCount}[]" required><div class="input-group-append"><button type="button" class="btn btn-outline-danger" onclick="this.parentElement.parentElement.remove()">&times;</button></div>`;
    optionsList.appendChild(optionDiv);
}
</script>
{% endblock %}
