{% extends "base.html" %}
{% block title %}{{ t.login }}{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
  <div class="col-md-6 col-lg-4">
    <div class="card animate-fade-in-up">
      <div class="card-header text-center">
        <div class="mb-3">
          <i class="fas fa-user-circle fa-3x text-white"></i>
        </div>
        <h2 class="mb-0">{{ t.login }}</h2>
        <p class="mb-0 opacity-75">Welcome back! Please sign in to continue.</p>
      </div>
      <div class="card-body p-4">
        <form method="post" action="{{ url_for('login') }}" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">
              <i class="fas fa-user me-2"></i>Username
            </label>
            <input type="text" 
                   class="form-control" 
                   name="username" 
                   id="username" 
                   placeholder="Enter your username"
                   required>
            <div class="invalid-feedback">
              Please enter your username.
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">
              <i class="fas fa-lock me-2"></i>Password
            </label>
            <div class="input-group">
              <input type="password" 
                     class="form-control" 
                     name="password" 
                     id="password" 
                     placeholder="Enter your password"
                     required>
              <button class="btn btn-outline-secondary" 
                      type="button" 
                      id="togglePassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">
              Please enter your password.
            </div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="fas fa-sign-in-alt me-2"></i>{{ t.login }}
            </button>
          </div>
        </form>
        <div class="text-center mt-4">
          <p class="mb-0">
            Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold">
              {{ t.register }}
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Password toggle functionality
  const togglePassword = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  
  togglePassword.addEventListener('click', function() {
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    this.querySelector('i').classList.toggle('fa-eye');
    this.querySelector('i').classList.toggle('fa-eye-slash');
  });
  
  // Form validation
  const form = document.querySelector('.needs-validation');
  form.addEventListener('submit', function(event) {
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
    }
    form.classList.add('was-validated');
  });
  
  // Auto-focus on username field
  document.getElementById('username').focus();
});
</script>
{% endblock %}
